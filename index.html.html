<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pagamentos - Fornecedores</title>
    <style>
        /* CSS para um visual moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: #2c3e50; }

        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-add:hover { background-color: #219150; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            color: #7f8c8d;
            text-transform: uppercase;
            font-size: 13px;
        }

        tr:hover { background-color: #f9f9f9; }

        /* Badges de Status */
        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pago { background-color: #d4edda; color: #155724; }
        .pendente { background-color: #fff3cd; color: #856404; }
        .atrasado { background-color: #f8d7da; color: #721c24; }

        .valor { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Gestão de Pagamentos</h2>
        <button class="btn-add">+ Novo Lançamento</button>
    </header>

    <table>
        <thead>
            <tr>
                <th>Fornecedor</th>
                <th>Vencimento</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>FlashApp Tech</td>
                <td>15/05/2026</td>
                <td class="valor">R$ 1.500,00</td>
                <td><span class="status pago">Pago</span></td>
                <td><button title="Editar">✏️</button></td>
            </tr>
            <tr>
                <td>Logística Express</td>
                <td>20/05/2026</td>
                <td class="valor">R$ 850,20</td>
                <td><span class="status pendente">Pendente</span></td>
                <td><button title="Editar">✏️</button></td>
            </tr>
            <tr>
                <td>Papelaria Central</td>
                <td>01/05/2026</td>
                <td class="valor">R$ 120,00</td>
                <td><span class="status atrasado">Atrasado</span></td>
                <td><button title="Editar">✏️</button></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
